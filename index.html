<!DOCTYPE html>
<html lang="zh">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
		<title>无人机模拟飞行</title>
		<style>
			:root {
				box-sizing: border-box;
				padding-top: env(safe-area-inset-top, 0px);
				padding-bottom: env(safe-area-inset-bottom, 0px);
				--bg: #0e1116;
				--glass: rgba(14, 18, 24, .62);
				--tx: #f2f5f8;
				--ac: #38bdf8
			}

			@media (prefers-color-scheme:dark) {
				:root:not([data-theme="light"]) {
					--bg: #0e1116
				}
			}

			:root[data-theme="dark"] {
				--bg: #0e1116
			}

			html {
				scroll-padding-top: env(safe-area-inset-top, 0px)
			}

			html,
			body {
				height: 100%
			}

			body {
				margin: 0;
				background: var(--bg);
				color: var(--tx);
				font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
				overflow: hidden;
				user-select: none;
				-webkit-user-select: none
			}

			#app {
				position: relative;
				width: 100%;
				height: 100%
			}

			canvas {
				display: block;
				position: absolute;
				inset: 0
			}

			.g {
				background: var(--glass);
				border: 1px solid rgba(255, 255, 255, .14);
				border-radius: 12px;
				backdrop-filter: blur(6px)
			}

			#hud {
				position: absolute;
				left: 10px;
				top: 10px;
				padding: 10px 12px;
				font-size: 13px;
				line-height: 1.6;
				min-width: 150px
			}

			#hud b {
				font-size: 16px;
				color: var(--ac)
			}

			#help {
				position: absolute;
				right: 10px;
				top: 10px;
				padding: 8px 12px;
				font-size: 12px;
				line-height: 1.7;
				max-width: 250px
			}

			#help summary {
				cursor: pointer;
				font-size: 13px
			}

			#bar {
				position: absolute;
				left: 0;
				right: 0;
				bottom: 10px;
				display: flex;
				flex-wrap: wrap;
				gap: 8px;
				justify-content: center;
				padding: 0 10px
			}

			button {
				font: inherit;
				font-size: 14px;
				padding: 9px 14px;
				border-radius: 10px;
				border: 1px solid rgba(255, 255, 255, .2);
				background: var(--glass);
				color: var(--tx);
				touch-action: none;
				backdrop-filter: blur(6px)
			}

			button:active {
				background: var(--ac);
				color: #000
			}

			#toast {
				position: absolute;
				left: 50%;
				top: 22%;
				transform: translateX(-50%);
				padding: 8px 16px;
				border-radius: 20px;
				background: var(--glass);
				opacity: 0;
				transition: opacity .3s;
				pointer-events: none;
				font-size: 15px
			}

			#fpv {
				position: absolute;
				inset: 0;
				pointer-events: none;
				display: none
			}

			#fpv:before,
			#fpv:after {
				content: "";
				position: absolute;
				left: 50%;
				top: 50%;
				background: rgba(255, 255, 255, .8)
			}

			#fpv:before {
				width: 24px;
				height: 2px;
				margin: -1px 0 0 -12px
			}

			#fpv:after {
				width: 2px;
				height: 24px;
				margin: -12px 0 0 -1px
			}

			.pad {
				position: absolute;
				bottom: 60px;
				display: none;
				grid-template-columns: repeat(3, 52px);
				grid-template-rows: repeat(3, 52px);
				gap: 6px
			}

			#pl {
				left: 12px
			}

			#pr {
				right: 12px
			}

			.pad button {
				padding: 0;
				font-size: 20px
			}

			@media (pointer:coarse) {
				.pad {
					display: grid
				}

				#bar {
					bottom: 8px
				}
			}

			/* ---- 折叠面板 ---- */
			#hudbox {
				position: absolute;
				left: 10px;
				top: 10px;
				padding: 8px 12px;
				min-width: 150px
			}

			#hud {
				font-size: 13px;
				line-height: 1.6;
				margin-top: 4px
			}

			#hud b {
				font-size: 16px;
				color: var(--ac)
			}

			.fh {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 10px;
				cursor: pointer;
				font-size: 13px;
				font-weight: 600;
				outline: none
			}

			.fh i {
				width: 7px;
				height: 7px;
				border-right: 2px solid var(--ac);
				border-bottom: 2px solid var(--ac);
				transform: rotate(45deg);
				margin: -3px 2px 0 0;
				transition: transform .2s
			}

			.fold.closed .fh i {
				transform: rotate(-45deg);
				margin: 0 2px 0 0
			}

			.fold.closed .fb {
				display: none
			}

			.fold.closed {
				min-width: 0
			}

			.fb {
				margin-top: 4px
			}

			#help {
				font-size: 12px
			}

			#bar button.off {
				opacity: .6
			}

			/* 信息面板加深背景，折叠后也清晰可读 */
			#hudbox,
			#help {
				background: rgba(8, 12, 18, .88);
				backdrop-filter: blur(8px);
				border-color: rgba(255, 255, 255, .22);
				box-shadow: 0 2px 10px rgba(0, 0, 0, .45)
			}

			.fh {
				color: #fff;
				text-shadow: 0 1px 3px #000
			}

			#hud {
				color: #ffffff;
				font-weight:999;
				text-shadow: 0 1px 2px rgba(0, 0, 0, .6)
			}
		</style>
	</head>
	<body>
		<div id="app">
			<div id="fpv"></div>
			<div id="hudbox" class="g fold"><div class="fh" tabindex="0" role="button" title="点击折叠/展开">飞行信息<i></i></div><div class="fb"><div id="hud"></div></div></div>
			<div id="help" class="g fold"><div class="fh" tabindex="0" role="button" title="点击折叠/展开">操作说明<i></i></div><div class="fb">
				
				<b>W/S</b> 前进/后退　<b>A/D</b> 左移/右移<br>
				<b>↑/空格</b> 上升　<b>↓/Shift</b> 下降<br>
				<b>←/Q</b> 左转　<b>→/E</b> 右转<br>
				<b>T</b> 起飞　<b>L</b> 降落　<b>H</b> 悬停刹车<br>
				<b>O</b> 环绕（A/D 换向，W/S 调半径）<br>
				<b>R</b> 一键返航　<b>V</b> 切换视角<br>
				<b>C</b> 切换档位　<b>Z/X</b> 云台俯仰<br><b>F</b> 机枪(按住)　<b>G</b> 发射导弹<br><b>I</b> 红外热成像　<b>N</b> 夜视仪<br><b>M</b> 音效开关<br><b>[ /
					]</b> 切换场景（共22个）
			</div></div>
			<div id="toast"></div>
			<div id="pl" class="pad"></div>
			<div id="pr" class="pad"></div>
			<div id="bar"></div>
		</div>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
		<script>
			const $ = id => document.getElementById(id),
				T = THREE;
			const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
			const angLerp = (a, b, t) => {
				const d = ((b - a + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
				return a + d * clamp(t, 0, 1)
			};
			let sd = 7;
			const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
			const mat = c => new T.MeshLambertMaterial({
				color: c
			});

			/* ---------- 场景 ---------- */
			const scene = new T.Scene();
			scene.background = new T.Color(0x9ccfee);
			scene.fog = new T.Fog(0x9ccfee, 90, 430);
			const cam = new T.PerspectiveCamera(62, 1, 0.1, 1200);
			cam.rotation.order = 'YXZ';
			const rd = new T.WebGLRenderer({
				antialias: true
			});
			rd.setPixelRatio(Math.min(devicePixelRatio, 2));
			$('app').prepend(rd.domElement);

			function rs() {
				const a = $('app');
				rd.setSize(a.clientWidth, a.clientHeight);
				cam.aspect = a.clientWidth / a.clientHeight;
				cam.updateProjectionMatrix()
			}
			addEventListener('resize', rs);
			rs();
			scene.add(new T.HemisphereLight(0xffffff, 0x446644, 0.95));
			const sun = new T.DirectionalLight(0xffffff, 0.7);
			sun.position.set(60, 100, 30);
			scene.add(sun);
			const gr = new T.Mesh(new T.PlaneGeometry(1200, 1200), mat(0x5a8f4a));
			gr.rotation.x = -Math.PI / 2;
			scene.add(gr);
			const grid = new T.GridHelper(1200, 240, 0x4a7a3c, 0x4f8341);
			grid.position.y = 0.02;
			scene.add(grid);
			const pad = new T.Mesh(new T.CircleGeometry(4, 40), mat(0x888b90));
			pad.rotation.x = -Math.PI / 2;
			pad.position.y = 0.04;
			scene.add(pad);
			[
				[-1, 0, .35, 2.4],
				[1, 0, .35, 2.4],
				[0, 0, 2, .35]
			].forEach(([x, z, w, d]) => {
				const b = new T.Mesh(new T.BoxGeometry(w, .02, d), mat(0xffffff));
				b.position.set(x, .06, z);
				scene.add(b)
			});
			const B = [];
			for (let i = 0; i < 16; i++) {
				const a = rnd() * 6.283,
					r = 30 + rnd() * 150,
					w = 8 + rnd() * 14,
					d = 8 + rnd() * 14,
					h = 10 + rnd() * 40,
					x = Math.cos(a) * r,
					z = Math.sin(a) * r;
				const m = new T.Mesh(new T.BoxGeometry(w, h, d), mat(new T.Color().setHSL(.58, .1 + rnd() * .15, .45 + rnd() *
					.3)));
				m.position.set(x, h / 2, z);
				scene.add(m);
				B.push({
					x,
					z,
					w,
					d,
					h
				})
			}
			for (let i = 0; i < 70; i++) {
				const a = rnd() * 6.283,
					r = 12 + rnd() * 230,
					x = Math.cos(a) * r,
					z = Math.sin(a) * r;
				const t = new T.Mesh(new T.CylinderGeometry(.3, .4, 2.5, 6), mat(0x6b4a2b));
				t.position.set(x, 1.25, z);
				const c = new T.Mesh(new T.ConeGeometry(1.8, 5, 8), mat(0x2f6b34));
				c.position.set(x, 5, z);
				scene.add(t, c)
			}
			const cm = new T.MeshBasicMaterial({
				color: 0xffffff,
				transparent: true,
				opacity: .9
			});
			for (let i = 0; i < 14; i++) {
				const c = new T.Mesh(new T.SphereGeometry(1, 10, 8), cm);
				c.scale.set(14 + rnd() * 14, 3 + rnd() * 2, 8 + rnd() * 8);
				c.position.set((rnd() - .5) * 600, 90 + rnd() * 50, (rnd() - .5) * 600);
				scene.add(c)
			}

			/* ---------- 无人机模型 ---------- */
			const G = 0.2,
				RTH_ALT = G + 15;
			const drone = new T.Group(),
				body = new T.Group();
			body.scale.setScalar(1.8);
			drone.add(body);
			scene.add(drone);
			const add = (g, p) => {
				const m = new T.Mesh(g, p.m);
				m.position.set(...p.p);
				if (p.r) m.rotation.y = p.r;
				body.add(m);
				return m
			};
			add(new T.BoxGeometry(.5, .14, .3), {
				m: mat(0xdadde2),
				p: [0, 0, 0]
			});
			add(new T.BoxGeometry(.3, .06, .2), {
				m: mat(0x4b5059),
				p: [0, .1, 0]
			});
			const blades = [];
			[
				[-1, -1],
				[1, -1],
				[-1, 1],
				[1, 1]
			].forEach(([sx, sz]) => {
				const dx = sx * .4,
					dz = sz * .3;
				add(new T.BoxGeometry(.5, .03, .04), {
					m: mat(0x4b5059),
					p: [dx / 2, .04, dz / 2],
					r: -Math.atan2(dz, dx)
				});
				add(new T.CylinderGeometry(.05, .05, .06, 10), {
					m: mat(0x2b2f35),
					p: [dx, .07, dz]
				});
				add(new T.SphereGeometry(.02, 8, 6), {
					m: new T.MeshBasicMaterial({
						color: sz < 0 ? 0xff2a2a : 0x2aff7a
					}),
					p: [dx, .03, dz]
				});
				const bl = add(new T.BoxGeometry(.55, .008, .045), {
					m: new T.MeshBasicMaterial({
						color: 0x222222,
						transparent: true,
						opacity: .75
					}),
					p: [dx, .11, dz]
				});
				blades.push(bl)
			});
			const gimbal = new T.Group();
			gimbal.position.set(0, -.09, -.17);
			body.add(gimbal);
			gimbal.add(new T.Mesh(new T.SphereGeometry(.07, 12, 10), mat(0x1d2025)));
			const lens = new T.Mesh(new T.CylinderGeometry(.03, .03, .05, 10), new T.MeshBasicMaterial({
				color: 0x55aaff
			}));
			lens.rotation.x = Math.PI / 2;
			lens.position.z = -.06;
			gimbal.add(lens);
			const shadow = new T.Mesh(new T.CircleGeometry(1, 24), new T.MeshBasicMaterial({
				color: 0,
				transparent: true,
				opacity: .35
			}));
			shadow.rotation.x = -Math.PI / 2;
			scene.add(shadow);
			const ring = new T.Mesh(new T.RingGeometry(.985, 1, 72), new T.MeshBasicMaterial({
				color: 0xffd23f,
				side: T.DoubleSide
			}));
			ring.rotation.x = -Math.PI / 2;
			ring.position.y = .08;
			ring.visible = false;
			scene.add(ring);
			const pole = new T.Mesh(new T.CylinderGeometry(.15, .15, 6, 8), new T.MeshBasicMaterial({
				color: 0xffd23f
			}));
			pole.visible = false;
			scene.add(pole);

			/* ---------- 状态 ---------- */
			const MODES = [{
				n: '平稳',
				v: 3,
				vs: 2,
				y: .8
			}, {
				n: '普通',
				v: 8,
				vs: 4,
				y: 1.5
			}, {
				n: '运动',
				v: 16,
				vs: 7,
				y: 2.2
			}];
			const S = {
				mode: 'landed',
				pos: new T.Vector3(0, G, 0),
				vel: new T.Vector3(),
				yaw: 0,
				gp: -.15,
				mi: 1,
				fpv: false,
				orbit: null,
				ph: 0,
				bat: 100,
				inp: 0,
				rot: 0,
				lowWarn: false
			};
			const keys = {},
				k = c => keys[c] ? 1 : 0;
			let tt;

			function toast(s) {
				const t = $('toast');
				t.textContent = s;
				t.style.opacity = 1;
				clearTimeout(tt);
				tt = setTimeout(() => t.style.opacity = 0, 1800)
			}

			const act = {
				takeoff() {
					if (S.mode !== 'landed') return;
					if (S.bat < 5) return toast('电量不足，无法起飞');
					S.mode = 'takeoff';
					toast('起飞')
				},
				land() {
					if (S.mode === 'landed' || S.mode === 'landing') return;
					S.mode = 'landing';
					S.orbit = null;
					toast('自动降落')
				},
				hover() {
					if (S.mode === 'landed') return;
					if (S.mode !== 'flying') {
						S.mode = 'flying'
					}
					S.orbit = null;
					S.vel.multiplyScalar(.15);
					toast('悬停')
				},
				orbit() {
					if (S.orbit) {
						S.orbit = null;
						toast('结束环绕');
						return
					}
					if (S.mode !== 'flying') return toast('请先起飞并进入飞行状态');
					const r = 10,
						c = new T.Vector3(-Math.sin(S.yaw) * r + S.pos.x, 0, -Math.cos(S.yaw) * r + S.pos.z);
					S.orbit = {
						c,
						r,
						th: Math.atan2(S.pos.z - c.z, S.pos.x - c.x),
						dir: 1
					};
					toast('环绕飞行：A/D 换向，W/S 调半径')
				},
				rth() {
					if (S.mode === 'rth') {
						S.mode = 'flying';
						return toast('取消返航')
					}
					if (S.mode !== 'flying' && S.mode !== 'takeoff') return;
					S.mode = 'rth';
					S.orbit = null;
					S.ph = S.pos.y >= RTH_ALT - .3 ? 1 : 0;
					toast('一键返航')
				},
				view() {
					S.fpv = !S.fpv;
					snap = true;
					$('fpv').style.display = S.fpv ? 'block' : 'none';
					toast(S.fpv ? '第一人称视角' : '第三人称视角')
				},
				speed() {
					S.mi = (S.mi + 1) % 3;
					toast('档位：' + MODES[S.mi].n)
				}
			};
			let snap = true;
			const ONCE = {
				KeyT: 'takeoff',
				KeyL: 'land',
				KeyH: 'hover',
				KeyO: 'orbit',
				KeyR: 'rth',
				KeyV: 'view',
				KeyC: 'speed'
			};
			addEventListener('keydown', e => {
				if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
				if (!e.repeat && ONCE[e.code]) act[ONCE[e.code]]();
				keys[e.code] = true
			});
			addEventListener('keyup', e => keys[e.code] = false);
			addEventListener('blur', () => {
				for (const c in keys) keys[c] = false
			});
			[
				['takeoff', '起飞 T'],
				['land', '降落 L'],
				['hover', '悬停 H'],
				['orbit', '环绕 O'],
				['rth', '返航 R'],
				['view', '视角 V'],
				['speed', '档位 C']
			].forEach(([a, t]) => {
				const b = document.createElement('button');
				b.textContent = t;
				b.onclick = () => act[a]();
				$('bar').appendChild(b)
			});
			// 触屏虚拟按键
			function pad_(id, list) {
				list.forEach(([t, code, c, r]) => {
					const b = document.createElement('button');
					b.textContent = t;
					b.style.gridColumn = c;
					b.style.gridRow = r;
					b.onpointerdown = e => {
						e.preventDefault();
						keys[code] = true
					};
					['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => b.addEventListener(ev, () => keys[
						code] = false));
					$(id).appendChild(b)
				})
			}
			pad_('pl', [
				['▲', 'ArrowUp', 2, 1],
				['⟲', 'ArrowLeft', 1, 2],
				['⟳', 'ArrowRight', 3, 2],
				['▼', 'ArrowDown', 2, 3]
			]);
			pad_('pr', [
				['↑', 'KeyW', 2, 1],
				['←', 'KeyA', 1, 2],
				['→', 'KeyD', 3, 2],
				['↓', 'KeyS', 2, 3]
			]);

			/* ---------- 物理与控制 ---------- */
			function update(dt) {
				const m = MODES[S.mi],
					fw = new T.Vector3(-Math.sin(S.yaw), 0, -Math.cos(S.yaw)),
					rg = new T.Vector3(Math.cos(S.yaw), 0, -Math.sin(S.yaw));
				const f = k('KeyW') - k('KeyS'),
					s = k('KeyD') - k('KeyA'),
					u = (k('ArrowUp') || k('Space')) - (k('ArrowDown') || k('ShiftLeft') || k('ShiftRight')),
					yw = (k('KeyE') || k('ArrowRight')) - (k('KeyQ') || k('ArrowLeft'));
				S.inp = Math.abs(f) + Math.abs(s) + Math.abs(u) + Math.abs(yw);
				S.gp = clamp(S.gp + (k('KeyX') - k('KeyZ')) * .8 * dt, -1.5, .35);
				const tv = new T.Vector3();
				let kk = 3,
					o = S.orbit;
				if (S.mode === 'takeoff') {
					tv.y = 2;
					if (S.pos.y >= G + 2.5) {
						S.mode = 'flying';
						toast('已起飞，悬停中')
					}
				} else if (S.mode === 'landing') {
					tv.y = -(S.pos.y > G + 3 ? 2 : 1);
					kk = 4;
					if (S.pos.y <= G + .02) landed()
				} else if (S.mode === 'rth') {
					const dx = -S.pos.x,
						dz = -S.pos.z,
						d = Math.hypot(dx, dz);
					if (S.ph === 0) {
						tv.y = 3;
						if (S.pos.y >= RTH_ALT) S.ph = 1
					} else if (S.ph === 1) {
						S.yaw = angLerp(S.yaw, Math.atan2(-dx, -dz), dt * 2.5);
						const sp = Math.min(7, d * .8 + 1);
						tv.set(dx / d * sp, 0, dz / d * sp);
						if (d < 1.2) {
							S.mode = 'landing';
							S.yaw = angLerp(S.yaw, 0, 1)
						}
					}
				} else if (S.mode === 'flying' && !o) {
					tv.addScaledVector(fw, f * m.v).addScaledVector(rg, s * m.v);
					tv.y = u * m.vs;
					S.yaw -= yw * m.y * dt;
					kk = (f || s || u) ? 2.5 : 4.5;
					if (S.pos.y > G + 120 && tv.y > 0) tv.y = 0;
				}
				if (S.mode === 'landed') {
					S.vel.set(0, 0, 0)
				} else if (o) {
					if (s > 0) o.dir = 1;
					if (s < 0) o.dir = -1;
					o.r = clamp(o.r - f * 3 * dt, 3, 60);
					o.th += o.dir * (m.v * .5) / o.r * dt;
					const nx = o.c.x + Math.cos(o.th) * o.r,
						nz = o.c.z + Math.sin(o.th) * o.r;
					S.vel.set((nx - S.pos.x) / dt, u * m.vs, (nz - S.pos.z) / dt);
					S.pos.x = nx;
					S.pos.z = nz;
					S.pos.y += u * m.vs * dt;
					S.yaw = angLerp(S.yaw, Math.atan2(-(o.c.x - nx), -(o.c.z - nz)), dt * 5);
				} else {
					S.vel.lerp(tv, 1 - Math.exp(-kk * dt));
					S.pos.addScaledVector(S.vel, dt)
				}

				if (S.pos.y <= G && S.mode !== 'landed') {

				}

							dz = S.pos.z - b.z,
							ox = b.w / 2 + 1 - Math.abs(dx),
							oz = b.d / 2 + 1 - Math.abs(dz);
						if (ox > 0 && oz > 0) {
							if (ox < oz) {
								S.pos.x += Math.sign(dx || 1) * ox;
								S.vel.x = 0
							} else {
								S.pos.z += Math.sign(dz || 1) * oz;
								S.vel.z = 0
							}
						}
					}

				body.rotation.z += (clamp(-rs_ * .035, -.45, .45) - body.rotation.z) * a;

				drone.rotation.y = S.yaw;

				shadow.position.set(S.pos.x, .07, S.pos.z);

					cam.lookAt(S.pos.x, S.pos.y + .5, S.pos.z)
				}
				snap = false;
				cam.updateProjectionMatrix();
			}

			function hurt(g, d) {
				g.hp -= d;
				if (g.hp <= 0 && !g.dead) {
					g.dead = true;
					WP.kills++;
					g.mk.visible = false;
					g.m.traverse(o => {
						if (o.material && o.material.emissive) {
							o.material.color.setHex(0x1a1a1a);
							o.material.emissive.setHex(0)
						}
					});
					g.m.scale.y = .5;
					boom(g.m.position.clone().setY(1.5), .8)
				}
			}

			function mkTargets(n) {
				for (let i = 0; i < n; i++) {
					let x, z, t = 0;
					do {
						const a = rnd() * 6.283,
							r = 30 + rnd() * 70;
						x = Math.cos(a) * r;
						z = Math.sin(a) * r
					} while (t++ < 40 && (B.some(b => Math.abs(x - b.x) < b.w / 2 + 3 && Math.abs(z - b.z) < b.d / 2 + 3) || SC[
							SI].sea && z < -90));

					const mk = new T.Mesh(new T.ConeGeometry(.5, 1.2, 8), BM(0xff2222)),

					g.add(new T.Mesh(new T.BoxGeometry(3, 1, 2), tm), tu, br, mk);

				SI = i;

				W.traverse(o => {
					o.geometry && o.geometry.dispose();
					o.material && o.material.dispose && o.material.dispose()
				});
				W.clear();
				AN.length = 0;
				TG.length = 0;
				FX.forEach(f => scene.remove(f.m));
				FX.length = 0;
				PR.concat(MS).forEach(p => scene.remove(p.m));
				PR.length = MS.length = 0;
				DEF.forEach(o => o.visible = !i);
				B.length = 0;
				if (!i) B.push(...B0);
				scene.background = new T.Color(s.sky);
				scene.fog = s.f ? new T.Fog(s.sky, s.f * .2, s.f) : null;
				gr.material.color.setHex(s.g);

				HL.intensity = s.l || .95;
				sun.intensity = s.s ?? .7;
				s.b && s.b();

				WP.kills = 0;

					const comp = AC.createDynamicsCompressor(),
						master = AC.createGain();

					comp.connect(master).connect(AC.destination);

					lp.type = 'lowpass';

					rg.gain.value = 0;
					lp.connect(rg).connect(comp);

						const o = AC.createOscillator(),

						o.type = 'sawtooth';
						o.frequency.value = 150 * r;
						g.gain.value = [.5, .4, .18, .1][i];
						o.connect(g).connect(lp);
						o.start();
						return {
							o,
							r
						}
					});
					const nb = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate),
						d = nb.getChannelData(0);
					for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
					const ns = AC.createBufferSource();
					ns.buffer = nb;
					ns.loop = true;
					const bp = AC.createBiquadFilter();
					bp.type = 'bandpass';
					bp.frequency.value = 500;

					const wg = AC.createGain();
					wg.gain.value = 0;
					ns.connect(bp).connect(wg).connect(comp);

				e.g.add(g);

			}

			function bird(c, s = 1, c2 = c, tl = .4) {
				const g = new T.Group(),
					b = pt(g, SG(.25), c, 0, 0, 0);
				b.scale.z = 1.6;
				pt(g, SG(.14), c, 0, .08, .4);
				pt(g, new T.ConeGeometry(.05, .18, 6), 0xffa000, 0, .06, .58).rotation.x = Math.PI / 2;
				pt(g, BG(.18, .03, tl), c2, 0, 0, -.4 - tl / 2);
				const mk = x => {
					const p = new T.Group();
					p.position.set(x * .15, .05, 0);
					pt(p, BG(.9, .04, .4), c2, x * .45, 0, 0);
					g.add(p);
					return p
				};
				g.scale.setScalar(s);
				return {
					g,
					wl: mk(-1),
					wr: mk(1)
				}
			}

			function car(c, s = 1) {
				const g = new T.Group(),
					wh = [];
				pt(g, BG(1.8, .6, 4), c, 0, .7, 0);
				pt(g, BG(1.5, .5, 2), 0x9fd4ee, 0, 1.2, -.2);
				[
					[-1, 1.3],
					[1, 1.3],
					[-1, -1.3],
					[1, -1.3]
				].forEach(([x, z]) => {
					const w = pt(g, new T.CylinderGeometry(.4, .4, .3, 10).rotateZ(Math.PI / 2), 0x151515, x * .95, .4, z);

			function plane(s = 1) {
				const g = new T.Group();
				pt(g, new T.CylinderGeometry(1.2, 1.2, 14, 12).rotateX(Math.PI / 2), 0xf4f4f4, 0, 0, 0);
				pt(g, new T.ConeGeometry(1.2, 3, 12).rotateX(Math.PI / 2), 0xdddddd, 0, 0, 8.5);
				pt(g, BG(17, .25, 3), 0x3a5fa0, 0, -.3, .5);
				pt(g, BG(6, .2, 1.6), 0x3a5fa0, 0, .2, -6.3);
				pt(g, BG(.2, 2.6, 2), 0x3a5fa0, 0, 1.6, -6.3);

			function ship(c, L) {
				const g = new T.Group();
				pt(g, BG(L * .22, 2.4, L), 0x303a48, 0, .4, 0);
				pt(g, BG(L * .2, 4, L * .14), 0xf2f2f2, 0, 3.8, -L * .38);
				for (let i = 0; i < 6; i++) pt(g, BG(L * .16, 2, L * .1), P(C), 0, 2.6, L * (.3 - i * .12));

					g
				}
			}

			const put = (e, x, z, y = 0) => {
					e.g.rotation.order = 'YXZ';
					e.g.position.set(x, y, z);
					W.add(e.g);
					if (e.u) AN.push(e.u);
					return e
				},
				spot = (ok, a = 9, b = 120, cx = 0, cz = 0) => {
					for (let i = 0; i < 80; i++) {
						const t = rnd() * 6.283,
							r = R(a, b),
							x = cx + Math.cos(t) * r,
							z = cz + Math.sin(t) * r;
						if (ok(x, z) && !hitB(x, z, 2) && Math.hypot(x, z) > 8) return [x, z]
					}
					return [R(15, 40), R(15, 40)]
				};

			function an(e, ph, a) {
				const L = e.legs;
				if (!L) return;
				if (e.k === 'b') {
					L[0].rotation.x = Math.sin(ph) * .7 * a;
					L[1].rotation.x = -L[0].rotation.x;
					e.arms[0].rotation.x = -L[0].rotation.x * .8;
					e.arms[1].rotation.x = -L[1].rotation.x * .8
				} else {
					const q = Math.sin(ph) * .6 * a;
					L[0].rotation.x = L[3].rotation.x = q;
					L[1].rotation.x = L[2].rotation.x = -q
				}
			}

			// 随机漫步；无人机靠近（低空）时会受惊奔逃
			function walker(e, o = {}) {
				const sp = o.v || 1.6,
					ok = o.ok || okD,
					y0 = o.y || 0;
				let h = rnd() * 6.28,
					tm = 0,
					ph = rnd() * 6,
					pz = 0;
				const c = o.c || [0, 0],
					[x, z] = spot(ok, o.a || 9, o.b || 120, c[0], c[1]);
				e.u = (t, dt) => {
					const p = e.g.position,
						dx = p.x - S.pos.x,
						dz = p.z - S.pos.z,
						d = Math.hypot(dx, dz);
					let v = sp,
						run = 0;
					if (o.flee !== false && S.mode !== 'landed' && d < 16 && S.pos.y < 22) {
						h = angLerp(h, Math.atan2(dx, dz), dt * 6);
						v = sp * 2.4;
						run = 1;
						pz = 0;
						tm = 1
					} else {
						tm -= dt;
						if (tm <= 0) {
							tm = 2 + rnd() * 4;
							h += (rnd() - .5) * 2.4;
							pz = rnd() < .25 ? 1 + rnd() * 2 : 0
						}
					}
					if (pz > 0) {
						pz -= dt;
						v = 0
					}
					const nx = p.x + Math.sin(h) * v * dt,
						nz = p.z + Math.cos(h) * v * dt;
					if (ok(nx, nz) && !hitB(nx, nz, 1.2)) {
						p.x = nx;
						p.z = nz
					} else {
						h += Math.PI * (.6 + rnd() * .8);
						tm = 1.5
					}
					e.g.rotation.y = angLerp(e.g.rotation.y, h, Math.min(1, dt * 8));
					ph += v * dt * (o.k || 4.5);
					an(e, ph, v > .05 ? (run ? 1.4 : 1) : 0);
					if (e.wh) e.wh.forEach(w => w.rotation.x += v * dt * 1.5);
					p.y = y0 + (o.hop ? Math.abs(Math.sin(ph * .6)) * o.hop * (v > .05 ? 1 : 0) : 0) + (o.hov ? Math.sin(t * 2 + ph) * .15 : 0)
				};
				return put(e, x, z, y0)
			}

			function orbit(e, c, r, y, w, o = {}) {
				let a = rnd() * 6.283;
				e.u = (t, dt) => {
					a += w * dt;
					const sg = Math.sign(w);
					e.g.position.set(c[0] + Math.cos(a) * r, y + Math.sin(t * 2 + a * 3) * (o.bz ?? 1), c[1] + Math.sin(a) * r);
					e.g.rotation.y = Math.atan2(-Math.sin(a) * sg, Math.cos(a) * sg);
					e.g.rotation.z = -(o.bank ?? .2) * sg;
					if (e.wl) {
						const q = Math.sin(t * (o.fl || 10) + a * 5) * .7;
						e.wl.rotation.z = -q;
						e.wr.rotation.z = q
					}
					if (e.legs) an(e, t * 12, 1)
				};
				return put(e, 0, 0, y)
			}

			function line(e, o) {
				const dx = o.x1 - o.x0,
					dz = o.z1 - o.z0,
					L = Math.hypot(dx, dz),
					hh = Math.atan2(dx, dz);
				let u = rnd() * L,
					d = 1,
					hd = hh;
				e.u = (t, dt) => {
					u += d * o.v * dt;
					if (u > L || u < 0) {
						if (o.wrap) u = (u + L) % L;
						else {
							d = -d;
							u = clamp(u, 0, L)
						}
					}
					const f = u / L,
						l = (o.off || 0) * d;
					e.g.position.set(o.x0 + dx * f + dz / L * l, o.y || 0, o.z0 + dz * f - dx / L * l);
					hd = angLerp(hd, d > 0 ? hh : hh + Math.PI, dt * 4);
					e.g.rotation.y = hd;
					if (e.wh) e.wh.forEach(w => w.rotation.x += o.v * dt * d * 1.4);
					if (e.legs) an(e, t * 10, 1)
				};
				return put(e, o.x0, o.z0)
			}

			function jump(e, x, z, y0, face) {
				let ph = rnd() * 6;
				const sp = 6 + rnd() * 3;
				e.u = (t, dt) => {
					ph += dt * sp;
					e.g.position.y = y0 + Math.abs(Math.sin(ph)) * .9;
					e.arms.forEach(a => a.rotation.x = -2.7 + Math.sin(ph * 2) * .4);
					e.g.rotation.y = face
				};
				return put(e, x, z, y0)
			}

			function floater(e, c, a) {
				e.legs.forEach((l, i) => l.rotation.x = .3 * (i ? 1 : -1));
				e.u = (t, dt) => {
					e.g.position.set(c[0] + Math.sin(t * .3 + a) * 14, c[1] + Math.sin(t * .5 + a * 2) * 4, c[2] + Math.cos(t * .25 + a) * 10);
					e.g.rotation.x += dt * .3;
					e.g.rotation.y += dt * .2
				};
				return put(e, c[0], c[2], c[1])
			}

			function dolphin() {
				const g = new T.Group(),
					b = pt(g, SG(.5), 0x6a8aa8, 0, 0, 0);
				b.scale.set(.8, .8, 2.6);
				pt(g, BG(.9, .08, .4), 0x6a8aa8, 0, 0, -1.4);
				pt(g, new T.ConeGeometry(.2, .5, 6), 0x5a7a98, 0, .45, -.1);
				g.scale.setScalar(2);
				let ph = rnd() * 6,
					Pd = 6,
					x = 0,
					z = -150,
					hd = 0;
				const e = {
					g
				};
				e.u = (t, dt) => {
					ph += dt;
					if (ph > Pd) {
						ph = 0;
						Pd = 5 + rnd() * 3;
						x = R(-130, 130);
						z = R(-300, -150);
						hd = rnd() * 6.28
					}
					const v = ph / 2.2;
					if (v < 1) {
						g.position.set(x + Math.sin(hd) * v * 14, -1.5 + Math.sin(Math.PI * v) * 5, z + Math.cos(hd) * v * 14);
						g.rotation.set(-Math.cos(Math.PI * v) * .9, hd, 0)
					} else g.position.y = -4
				};
				return put(e, 0, -200, -4)
			}

			function takeoff() {
				const e = plane(1);
				let z = -290,
					v = 0,
					wait = 2;
				e.u = (t, dt) => {
					if (wait > 0) {
						wait -= dt;
						return
					}
					v = Math.min(62, v + 7 * dt);
					z += v * dt;
					const y = Math.max(0, (z - 60) * .4);
					e.g.position.set(60, y + 1.5, z);
					e.g.rotation.x = y > 0 ? -.25 : 0;
					if (z > 380) {
						z = -290;
						v = 0;
						wait = 6 + rnd() * 6
					}
				};
				return put(e, 60, -290, 1.5)
			}

			function soccer() {
				const ball = new T.Mesh(SG(.45), lm(0xffffff)),
					bv = new T.Vector3(),
					ps = [];
				let kt = 0;
				ball.position.y = .45;
				W.add(ball);
				for (let i = 0; i < 22; i++) {
					const tm = i < 11,
						e = biped({
							shirt: tm ? 0xe53935 : 0x1e88e5,
							pants: tm ? 0xffffff : 0x111111,
							hair: 0x222222
						}),
						hx = (tm ? -1 : 1) * R(8, 45),
						hz = R(-28, 28);
					put(e, hx, hz);
					ps.push({
						e,
						hx,
						hz,
						ph: rnd() * 6,
						h: 0
					})
				}
				AN.push((t, dt) => {
					kt -= dt;
					if (kt <= 0) {
						kt = R(1, 2.2);
						const a = rnd() * 6.283;
						bv.set(Math.sin(a), 0, Math.cos(a)).multiplyScalar(R(8, 20))
					}
					const bp = ball.position;
					bp.x += bv.x * dt;
					bp.z += bv.z * dt;
					bv.multiplyScalar(Math.exp(-dt * .8));
					if (Math.abs(bp.x) > 50) {
						bv.x *= -1;
						bp.x = clamp(bp.x, -50, 50)
					}
					if (Math.abs(bp.z) > 31) {
						bv.z *= -1;
						bp.z = clamp(bp.z, -31, 31)
					}
					ps.forEach(p => {
						const q = p.e.g.position,
							dx = .55 * bp.x + .45 * p.hx - q.x,
							dz = .55 * bp.z + .45 * p.hz - q.z,
							d = Math.hypot(dx, dz),
							v = Math.min(6.5, d * 1.2);
						if (d > .3) {
							q.x += dx / d * v * dt;
							q.z += dz / d * v * dt;
							p.h = angLerp(p.h, Math.atan2(dx, dz), dt * 8)
						}
						p.e.g.rotation.y = p.h;
						p.ph += v * dt * 2.2;
						an(p.e, p.ph, v > .3 ? 1.2 : 0)
					})
				})
			}
