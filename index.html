<!DOCTYPE html>
<html lang="zh">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
		<title>无人机模拟飞行</title>
		<style>
			:root {
				box-sizing: border-box;
				padding-top: env(safe-area-inset-top, 0px);
				padding-bottom: env(safe-area-inset-bottom, 0px);
				--bg: #0e1116;
				--glass: rgba(14, 18, 24, .62);
				--tx: #f2f5f8;
				--ac: #38bdf8
			}

			@media (prefers-color-scheme:dark) {
				:root:not([data-theme="light"]) {
					--bg: #0e1116
				}
			}

			:root[data-theme="dark"] {
				--bg: #0e1116
			}

			html {
				scroll-padding-top: env(safe-area-inset-top, 0px)
			}

			html,
			body {
				height: 100%
			}

			body {
				margin: 0;
				background: var(--bg);
				color: var(--tx);
				font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
				overflow: hidden;
				user-select: none;
				-webkit-user-select: none
			}

			#app {
				position: relative;
				width: 100%;
				height: 100%
			}

			canvas {
				display: block;
				position: absolute;
				inset: 0
			}

			.g {
				background: var(--glass);
				border: 1px solid rgba(255, 255, 255, .14);
				border-radius: 12px;
				backdrop-filter: blur(6px)
			}

			#hud {
				position: absolute;
				left: 10px;
				top: 10px;
				padding: 10px 12px;
				font-size: 13px;
				line-height: 1.6;
				min-width: 150px
			}

			#hud b {
				font-size: 16px;
				color: var(--ac)
			}

			#help {
				position: absolute;
				right: 10px;
				top: 10px;
				padding: 8px 12px;
				font-size: 12px;
				line-height: 1.7;
				max-width: 250px
			}

			#help summary {
				cursor: pointer;
				font-size: 13px
			}

			#bar {
				position: absolute;
				left: 0;
				right: 0;
				bottom: 10px;
				display: flex;
				flex-wrap: wrap;
				gap: 8px;
				justify-content: center;
				padding: 0 10px
			}

			button {
				font: inherit;
				font-size: 14px;
				padding: 9px 14px;
				border-radius: 10px;
				border: 1px solid rgba(255, 255, 255, .2);
				background: var(--glass);
				color: var(--tx);
				touch-action: none;
				backdrop-filter: blur(6px)
			}

			button:active {
				background: var(--ac);
				color: #000
			}

			#toast {
				position: absolute;
				left: 50%;
				top: 22%;
				transform: translateX(-50%);
				padding: 8px 16px;
				border-radius: 20px;
				background: var(--glass);
				opacity: 0;
				transition: opacity .3s;
				pointer-events: none;
				font-size: 15px
			}

			#fpv {
				position: absolute;
				inset: 0;
				pointer-events: none;
				display: none
			}

			#fpv:before,
			#fpv:after {
				content: "";
				position: absolute;
				left: 50%;
				top: 50%;
				background: rgba(255, 255, 255, .8)
			}

			#fpv:before {
				width: 24px;
				height: 2px;
				margin: -1px 0 0 -12px
			}

			#fpv:after {
				width: 2px;
				height: 24px;
				margin: -12px 0 0 -1px
			}

			.pad {
				position: absolute;
				bottom: 60px;
				display: none;
				grid-template-columns: repeat(3, 52px);
				grid-template-rows: repeat(3, 52px);
				gap: 6px
			}

			#pl {
				left: 12px
			}

			#pr {
				right: 12px
			}

			.pad button {
				padding: 0;
				font-size: 20px
			}

			@media (pointer:coarse) {
				.pad {
					display: grid
				}

				#bar {
					bottom: 8px
				}
			}
		</style>
	</head>
	<body>
		<div id="app">
			<div id="fpv"></div>
			<div id="hud" class="g"></div>
			<details id="help" class="g" open>
				<summary>操作说明</summary>
				<b>W/S</b> 前进/后退　<b>A/D</b> 左移/右移<br>
				<b>↑/空格</b> 上升　<b>↓/Shift</b> 下降<br>
				<b>←/Q</b> 左转　<b>→/E</b> 右转<br>
				<b>T</b> 起飞　<b>L</b> 降落　<b>H</b> 悬停刹车<br>
				<b>O</b> 环绕（A/D 换向，W/S 调半径）<br>
				<b>R</b> 一键返航　<b>V</b> 切换视角<br>
				<b>C</b> 切换档位　<b>Z/X</b> 云台俯仰<br><b>F</b> 机枪(按住)　<b>G</b> 发射导弹<br><b>I</b> 红外热成像　<b>N</b> 夜视仪<br><b>[ /
					]</b> 切换场景（共22个）
			</details>
			<div id="toast"></div>
			<div id="pl" class="pad"></div>
			<div id="pr" class="pad"></div>
			<div id="bar"></div>
		</div>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
		<script>
			const $ = id => document.getElementById(id),
				T = THREE;
			const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
			const angLerp = (a, b, t) => {
				const d = ((b - a + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
				return a + d * clamp(t, 0, 1)
			};
			let sd = 7;
			const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
			const mat = c => new T.MeshLambertMaterial({
				color: c
			});

			/* ---------- 场景 ---------- */
			const scene = new T.Scene();
			scene.background = new T.Color(0x9ccfee);
			scene.fog = new T.Fog(0x9ccfee, 90, 430);
			const cam = new T.PerspectiveCamera(62, 1, 0.1, 1200);
			cam.rotation.order = 'YXZ';
			const rd = new T.WebGLRenderer({
				antialias: true
			});
			rd.setPixelRatio(Math.min(devicePixelRatio, 2));
			$('app').prepend(rd.domElement);

			function rs() {
				const a = $('app');
				rd.setSize(a.clientWidth, a.clientHeight);
				cam.aspect = a.clientWidth / a.clientHeight;
				cam.updateProjectionMatrix()
			}
			addEventListener('resize', rs);
			rs();
			scene.add(new T.HemisphereLight(0xffffff, 0x446644, 0.95));
			const sun = new T.DirectionalLight(0xffffff, 0.7);
			sun.position.set(60, 100, 30);
			scene.add(sun);
			const gr = new T.Mesh(new T.PlaneGeometry(1200, 1200), mat(0x5a8f4a));
			gr.rotation.x = -Math.PI / 2;
			scene.add(gr);
			const grid = new T.GridHelper(1200, 240, 0x4a7a3c, 0x4f8341);
			grid.position.y = 0.02;
			scene.add(grid);
			const pad = new T.Mesh(new T.CircleGeometry(4, 40), mat(0x888b90));
			pad.rotation.x = -Math.PI / 2;
			pad.position.y = 0.04;
			scene.add(pad);
			[
				[-1, 0, .35, 2.4],
				[1, 0, .35, 2.4],
				[0, 0, 2, .35]
			].forEach(([x, z, w, d]) => {
				const b = new T.Mesh(new T.BoxGeometry(w, .02, d), mat(0xffffff));
				b.position.set(x, .06, z);
				scene.add(b)
			});
			const B = [];
			for (let i = 0; i < 16; i++) {
				const a = rnd() * 6.283,
					r = 30 + rnd() * 150,
					w = 8 + rnd() * 14,
					d = 8 + rnd() * 14,
					h = 10 + rnd() * 40,
					x = Math.cos(a) * r,
					z = Math.sin(a) * r;
				const m = new T.Mesh(new T.BoxGeometry(w, h, d), mat(new T.Color().setHSL(.58, .1 + rnd() * .15, .45 + rnd() *
					.3)));
				m.position.set(x, h / 2, z);
				scene.add(m);
				B.push({
					x,
					z,
					w,
					d,
					h
				})
			}
			for (let i = 0; i < 70; i++) {
				const a = rnd() * 6.283,
					r = 12 + rnd() * 230,
					x = Math.cos(a) * r,
					z = Math.sin(a) * r;
				const t = new T.Mesh(new T.CylinderGeometry(.3, .4, 2.5, 6), mat(0x6b4a2b));
				t.position.set(x, 1.25, z);
				const c = new T.Mesh(new T.ConeGeometry(1.8, 5, 8), mat(0x2f6b34));
				c.position.set(x, 5, z);
				scene.add(t, c)
			}
			const cm = new T.MeshBasicMaterial({
				color: 0xffffff,
				transparent: true,
				opacity: .9
			});
			for (let i = 0; i < 14; i++) {
				const c = new T.Mesh(new T.SphereGeometry(1, 10, 8), cm);
				c.scale.set(14 + rnd() * 14, 3 + rnd() * 2, 8 + rnd() * 8);
				c.position.set((rnd() - .5) * 600, 90 + rnd() * 50, (rnd() - .5) * 600);
				scene.add(c)
			}

			/* ---------- 无人机模型 ---------- */
			const G = 0.2,
				RTH_ALT = G + 15;
			const drone = new T.Group(),
				body = new T.Group();
			body.scale.setScalar(1.8);
			drone.add(body);
			scene.add(drone);
			const add = (g, p) => {
				const m = new T.Mesh(g, p.m);
				m.position.set(...p.p);
				if (p.r) m.rotation.y = p.r;
				body.add(m);
				return m
			};
			add(new T.BoxGeometry(.5, .14, .3), {
				m: mat(0xdadde2),
				p: [0, 0, 0]
			});
			add(new T.BoxGeometry(.3, .06, .2), {
				m: mat(0x4b5059),
				p: [0, .1, 0]
			});
			const blades = [];
			[
				[-1, -1],
				[1, -1],
				[-1, 1],
				[1, 1]
			].forEach(([sx, sz]) => {
				const dx = sx * .4,
					dz = sz * .3;
				add(new T.BoxGeometry(.5, .03, .04), {
					m: mat(0x4b5059),
					p: [dx / 2, .04, dz / 2],
					r: -Math.atan2(dz, dx)
				});
				add(new T.CylinderGeometry(.05, .05, .06, 10), {
					m: mat(0x2b2f35),
					p: [dx, .07, dz]
				});
				add(new T.SphereGeometry(.02, 8, 6), {
					m: new T.MeshBasicMaterial({
						color: sz < 0 ? 0xff2a2a : 0x2aff7a
					}),
					p: [dx, .03, dz]
				});
				const bl = add(new T.BoxGeometry(.55, .008, .045), {
					m: new T.MeshBasicMaterial({
						color: 0x222222,
						transparent: true,
						opacity: .75
					}),
					p: [dx, .11, dz]
				});
				blades.push(bl)
			});
			const gimbal = new T.Group();
			gimbal.position.set(0, -.09, -.17);
			body.add(gimbal);
			gimbal.add(new T.Mesh(new T.SphereGeometry(.07, 12, 10), mat(0x1d2025)));
			const lens = new T.Mesh(new T.CylinderGeometry(.03, .03, .05, 10), new T.MeshBasicMaterial({
				color: 0x55aaff
			}));
			lens.rotation.x = Math.PI / 2;
			lens.position.z = -.06;
			gimbal.add(lens);
			const shadow = new T.Mesh(new T.CircleGeometry(1, 24), new T.MeshBasicMaterial({
				color: 0,
				transparent: true,
				opacity: .35
			}));
			shadow.rotation.x = -Math.PI / 2;
			scene.add(shadow);
			const ring = new T.Mesh(new T.RingGeometry(.985, 1, 72), new T.MeshBasicMaterial({
				color: 0xffd23f,
				side: T.DoubleSide
			}));
			ring.rotation.x = -Math.PI / 2;
			ring.position.y = .08;
			ring.visible = false;
			scene.add(ring);
			const pole = new T.Mesh(new T.CylinderGeometry(.15, .15, 6, 8), new T.MeshBasicMaterial({
				color: 0xffd23f
			}));
			pole.visible = false;
			scene.add(pole);

			/* ---------- 状态 ---------- */
			const MODES = [{
				n: '平稳',
				v: 3,
				vs: 2,
				y: .8
			}, {
				n: '普通',
				v: 8,
				vs: 4,
				y: 1.5
			}, {
				n: '运动',
				v: 16,
				vs: 7,
				y: 2.2
			}];
			const S = {
				mode: 'landed',
				pos: new T.Vector3(0, G, 0),
				vel: new T.Vector3(),
				yaw: 0,
				gp: -.15,
				mi: 1,
				fpv: false,
				orbit: null,
				ph: 0,
				bat: 100,
				inp: 0,
				rot: 0,
				lowWarn: false
			};
			const keys = {},
				k = c => keys[c] ? 1 : 0;
			let tt;

			function toast(s) {
				const t = $('toast');
				t.textContent = s;
				t.style.opacity = 1;
				clearTimeout(tt);
				tt = setTimeout(() => t.style.opacity = 0, 1800)
			}

			const act = {
				takeoff() {
					if (S.mode !== 'landed') return;
					if (S.bat < 5) return toast('电量不足，无法起飞');
					S.mode = 'takeoff';
					toast('起飞')
				},
				land() {
					if (S.mode === 'landed' || S.mode === 'landing') return;
					S.mode = 'landing';
					S.orbit = null;
					toast('自动降落')
				},
				hover() {
					if (S.mode === 'landed') return;
					if (S.mode !== 'flying') {
						S.mode = 'flying'
					}
					S.orbit = null;
					S.vel.multiplyScalar(.15);
					toast('悬停')
				},
				orbit() {
					if (S.orbit) {
						S.orbit = null;
						toast('结束环绕');
						return
					}
					if (S.mode !== 'flying') return toast('请先起飞并进入飞行状态');
					const r = 10,
						c = new T.Vector3(-Math.sin(S.yaw) * r + S.pos.x, 0, -Math.cos(S.yaw) * r + S.pos.z);
					S.orbit = {
						c,
						r,
						th: Math.atan2(S.pos.z - c.z, S.pos.x - c.x),
						dir: 1
					};
					toast('环绕飞行：A/D 换向，W/S 调半径')
				},
				rth() {
					if (S.mode === 'rth') {
						S.mode = 'flying';
						return toast('取消返航')
					}
					if (S.mode !== 'flying' && S.mode !== 'takeoff') return;
					S.mode = 'rth';
					S.orbit = null;
					S.ph = S.pos.y >= RTH_ALT - .3 ? 1 : 0;
					toast('一键返航')
				},
				view() {
					S.fpv = !S.fpv;
					snap = true;
					$('fpv').style.display = S.fpv ? 'block' : 'none';
					toast(S.fpv ? '第一人称视角' : '第三人称视角')
				},
				speed() {
					S.mi = (S.mi + 1) % 3;
					toast('档位：' + MODES[S.mi].n)
				}
			};
			let snap = true;
			const ONCE = {
				KeyT: 'takeoff',
				KeyL: 'land',
				KeyH: 'hover',
				KeyO: 'orbit',
				KeyR: 'rth',
				KeyV: 'view',
				KeyC: 'speed'
			};
			addEventListener('keydown', e => {
				if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
				if (!e.repeat && ONCE[e.code]) act[ONCE[e.code]]();
				keys[e.code] = true
			});
			addEventListener('keyup', e => keys[e.code] = false);
			addEventListener('blur', () => {
				for (const c in keys) keys[c] = false
			});
			[
				['takeoff', '起飞 T'],
				['land', '降落 L'],
				['hover', '悬停 H'],
				['orbit', '环绕 O'],
				['rth', '返航 R'],
				['view', '视角 V'],
				['speed', '档位 C']
			].forEach(([a, t]) => {
				const b = document.createElement('button');
				b.textContent = t;
				b.onclick = () => act[a]();
				$('bar').appendChild(b)
			});
			// 触屏虚拟按键
			function pad_(id, list) {
				list.forEach(([t, code, c, r]) => {
					const b = document.createElement('button');
					b.textContent = t;
					b.style.gridColumn = c;
					b.style.gridRow = r;
					b.onpointerdown = e => {
						e.preventDefault();
						keys[code] = true
					};
					['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => b.addEventListener(ev, () => keys[
						code] = false));
					$(id).appendChild(b)
				})
			}
			pad_('pl', [
				['▲', 'ArrowUp', 2, 1],
				['⟲', 'ArrowLeft', 1, 2],
				['⟳', 'ArrowRight', 3, 2],
				['▼', 'ArrowDown', 2, 3]
			]);
			pad_('pr', [
				['↑', 'KeyW', 2, 1],
				['←', 'KeyA', 1, 2],
				['→', 'KeyD', 3, 2],
				['↓', 'KeyS', 2, 3]
			]);

			/* ---------- 物理与控制 ---------- */
			function update(dt) {
				const m = MODES[S.mi],
					fw = new T.Vector3(-Math.sin(S.yaw), 0, -Math.cos(S.yaw)),
					rg = new T.Vector3(Math.cos(S.yaw), 0, -Math.sin(S.yaw));
				const f = k('KeyW') - k('KeyS'),
					s = k('KeyD') - k('KeyA'),
					u = (k('ArrowUp') || k('Space')) - (k('ArrowDown') || k('ShiftLeft') || k('ShiftRight')),
					yw = (k('KeyE') || k('ArrowRight')) - (k('KeyQ') || k('ArrowLeft'));
				S.inp = Math.abs(f) + Math.abs(s) + Math.abs(u) + Math.abs(yw);
				S.gp = clamp(S.gp + (k('KeyX') - k('KeyZ')) * .8 * dt, -1.5, .35);
				const tv = new T.Vector3();
				let kk = 3,
					o = S.orbit;
				if (S.mode === 'takeoff') {
					tv.y = 2;
					if (S.pos.y >= G + 2.5) {
						S.mode = 'flying';
						toast('已起飞，悬停中')
					}
				} else if (S.mode === 'landing') {
					tv.y = -(S.pos.y > G + 3 ? 2 : 1);
					kk = 4;
					if (S.pos.y <= G + .02) landed()
				} else if (S.mode === 'rth') {
					const dx = -S.pos.x,
						dz = -S.pos.z,
						d = Math.hypot(dx, dz);
					if (S.ph === 0) {
						tv.y = 3;
						if (S.pos.y >= RTH_ALT) S.ph = 1
					} else if (S.ph === 1) {
						S.yaw = angLerp(S.yaw, Math.atan2(-dx, -dz), dt * 2.5);
						const sp = Math.min(7, d * .8 + 1);
						tv.set(dx / d * sp, 0, dz / d * sp);
						if (d < 1.2) {
							S.mode = 'landing';
							S.yaw = angLerp(S.yaw, 0, 1)
						}
					}
				} else if (S.mode === 'flying' && !o) {
					tv.addScaledVector(fw, f * m.v).addScaledVector(rg, s * m.v);
					tv.y = u * m.vs;
					S.yaw -= yw * m.y * dt;
					kk = (f || s || u) ? 2.5 : 4.5;
					if (S.pos.y > G + 120 && tv.y > 0) tv.y = 0;
				}
				if (S.mode === 'landed') {
					S.vel.set(0, 0, 0)
				} else if (o) {
					if (s > 0) o.dir = 1;
					if (s < 0) o.dir = -1;
					o.r = clamp(o.r - f * 3 * dt, 3, 60);
					o.th += o.dir * (m.v * .5) / o.r * dt;
					const nx = o.c.x + Math.cos(o.th) * o.r,
						nz = o.c.z + Math.sin(o.th) * o.r;
					S.vel.set((nx - S.pos.x) / dt, u * m.vs, (nz - S.pos.z) / dt);
					S.pos.x = nx;
					S.pos.z = nz;
					S.pos.y += u * m.vs * dt;
					S.yaw = angLerp(S.yaw, Math.atan2(-(o.c.x - nx), -(o.c.z - nz)), dt * 5);
				} else {
					S.vel.lerp(tv, 1 - Math.exp(-kk * dt));
					S.pos.addScaledVector(S.vel, dt)
				}
				// 地面与建筑碰撞
				if (S.pos.y <= G && S.mode !== 'landed') {
					S.pos.y = G;
					if (S.vel.y < 0) S.vel.y = 0;
					if (S.mode === 'flying' && u < 0) landed()
				}
				B.forEach(b => {
					if (S.pos.y < b.h + .6) {
						const dx = S.pos.x - b.x,
							dz = S.pos.z - b.z,
							ox = b.w / 2 + 1 - Math.abs(dx),
							oz = b.d / 2 + 1 - Math.abs(dz);
						if (ox > 0 && oz > 0) {
							if (ox < oz) {
								S.pos.x += Math.sign(dx || 1) * ox;
								S.vel.x = 0
							} else {
								S.pos.z += Math.sign(dz || 1) * oz;
								S.vel.z = 0
							}
						}
					}
				});
				// 电量
				if (S.mode === 'landed') S.bat = Math.min(100, S.bat + dt);
				else S.bat -= .12 * dt;
				if (S.bat < 20 && !S.lowWarn) {
					S.lowWarn = true;
					toast('电量低，请尽快返航 / 降落')
				}
				if (S.bat > 25) S.lowWarn = false;
				if (S.bat <= 0 && S.mode !== 'landed' && S.mode !== 'landing') {
					S.bat = 0;
					act.land();
					toast('电量耗尽，强制降落')
				}
				// 模型姿态
				S.rot += ((S.mode === 'landed' ? 0 : 55) - S.rot) * Math.min(1, dt * 3);
				blades.forEach((b, i) => b.rotation.y += S.rot * dt * (i % 2 ? -1 : 1));
				const fs = S.vel.dot(fw),
					rs_ = S.vel.dot(rg),
					a = Math.min(1, dt * 6);
				body.rotation.x += (clamp(-fs * .035, -.45, .45) - body.rotation.x) * a;
				body.rotation.z += (clamp(-rs_ * .035, -.45, .45) - body.rotation.z) * a;
				gimbal.rotation.x = S.gp;
				drone.position.copy(S.pos);
				drone.rotation.y = S.yaw;
				const alt = S.pos.y - G;
				shadow.position.set(S.pos.x, .07, S.pos.z);
				shadow.scale.setScalar(.6 / (1 + alt * .04) + .2);
				shadow.material.opacity = clamp(.4 - alt * .004, .1, .4);
				ring.visible = pole.visible = !!o;
				if (o) {
					ring.position.x = pole.position.x = o.c.x;
					ring.position.z = pole.position.z = o.c.z;
					ring.scale.setScalar(o.r);
					pole.position.y = 3
				}
				// 相机
				if (S.fpv) {
					drone.visible = false;
					cam.fov = 78;
					cam.position.copy(S.pos).addScaledVector(fw, .8);
					cam.position.y += .1;

				} else {

					else cam.position.lerp(ideal, 1 - Math.exp(-dt * 5));
					cam.lookAt(S.pos.x, S.pos.y + .5, S.pos.z)
				}
				snap = false;
				cam.updateProjectionMatrix();
			}

					g.dead = true;
					WP.kills++;
					g.mk.visible = false;
					g.m.traverse(o => {
						if (o.material && o.material.emissive) {
							o.material.color.setHex(0x1a1a1a);
							o.material.emissive.setHex(0)
						}
					});
					g.m.scale.y = .5;
					boom(g.m.position.clone().setY(1.5), .8)

			}

			function mkTargets(n) {
				for (let i = 0; i < n; i++) {
					let x, z, t = 0;
					do {
						const a = rnd() * 6.283,
							r = 30 + rnd() * 70;
						x = Math.cos(a) * r;
						z = Math.sin(a) * r
					} while (t++ < 40 && (B.some(b => Math.abs(x - b.x) < b.w / 2 + 3 && Math.abs(z - b.z) < b.d / 2 + 3) || SC[
							SI].sea && z < -90));

						tm = mat(0xb03a2a);

					const mk = new T.Mesh(new T.ConeGeometry(.5, 1.2, 8), BM(0xff2222)),
						br = new T.Mesh(new T.BoxGeometry(.2, .2, 1.6), tm),

					tu.position.y = .8;

					mk.position.y = 4;
					mk.rotation.x = Math.PI;
					g.add(new T.Mesh(new T.BoxGeometry(3, 1, 2), tm), tu, br, mk);
					g.position.set(x, .5, z);
					g.rotation.y = rnd() * 6.28;
					W.add(g);
					TG.push({
						m: g,
						hp: 3,
						r: 2.4,

			}

			function load(i) {
				SI = i;
				const s = SC[i];
				W.traverse(o => {
					o.geometry && o.geometry.dispose();
					o.material && o.material.dispose && o.material.dispose()
				});
				W.clear();
				AN.length = 0;
				TG.length = 0;
				FX.forEach(f => scene.remove(f.m));
				FX.length = 0;
				PR.concat(MS).forEach(p => scene.remove(p.m));
				PR.length = MS.length = 0;
				DEF.forEach(o => o.visible = !i);
				B.length = 0;
				if (!i) B.push(...B0);
				scene.background = new T.Color(s.sky);
				scene.fog = s.f ? new T.Fog(s.sky, s.f * .2, s.f) : null;
				gr.material.color.setHex(s.g);
				grid.visible = !i;
				HL.intensity = s.l || .95;
				sun.intensity = s.s ?? .7;
				s.b && s.b();
				mkTargets(8);
				WP.kills = 0;
				landed();
				S.pos.set(0, G, 0);
				S.yaw = 0;

			function mkMs(sc_, fl) {

			function puff(p, c = 0xcccccc, L = 1.2, s = 1) {

			function boom(p, s = 1) {
				const m = new T.Mesh(new T.SphereGeometry(1, 14, 10), new T.MeshBasicMaterial({
					color: 0xffe080,
					transparent: true,
					opacity: .95
				}));
				m.position.copy(p);
				scene.add(m);
				FX.push({
					m,
					t: 0,
					L: .7,
					u: f => {
						m.scale.setScalar(s * (1.5 + f * 5));
						m.material.opacity = .95 * (1 - f);
						m.material.color.setHex(f < .25 ? 0xffe080 : f < .5 ? 0xff8a20 : 0x802010)
					}
				});
				for (let i = 0; i < 14; i++) {
					const d = new T.Mesh(new T.BoxGeometry(.3, .3, .3), BM(pick([0xff8a20, 0x333333, 0xffd060])));
					d.position.copy(p);
					scene.add(d);
					const v = new T.Vector3(rnd() - .5, rnd() * .9 + .2, rnd() - .5).multiplyScalar(22 * s);
					FX.push({
						m: d,
						t: 0,
						L: 1.2,
						u: (f, dt) => {
							v.y -= 25 * dt;
							d.position.addScaledVector(v, dt);
							d.rotation.x += dt * 8
						}
					})
				}
				for (let i = 0; i < 5; i++) puff(p.clone().add(new T.Vector3(rnd() * 3 - 1.5, rnd() * 3, rnd() * 3 - 1.5)),
					0x444444, 2.2, 3 * s);
				FL.position.copy(p);
				FL.intensity = 6;
				WP.shake = Math.max(WP.shake, clamp(1 - cam.position.distanceTo(p) / 150, 0, 1) * 1.2);
				snd(90, .5, 1)
			}

						g = AC.createGain();
					o.type = n ? 'sawtooth' : 'square';
					o.frequency.setValueAtTime(f, t);
					o.frequency.exponentialRampToValueAtTime(f / 3, t + d);
					g.gain.setValueAtTime(.1, t);
					g.gain.exponentialRampToValueAtTime(.001, t + d);
					o.connect(g).connect(AC.destination);
					o.start();
					o.stop(t + d)
				} catch (e) {}
			}

			function lockT(d) {
				let b = null,
					bc = .93;
				TG.forEach(g => {
					if (g.dead) return;
					const v = g.m.position.clone().sub(S.pos),
						L = v.length();
					if (L < 400 && L > 5) {
						const c = v.normalize().dot(d);
						if (c > bc) {
							bc = c;
							b = g
						}
					}
				});
				return b
			}

			function shoot(d, rg) {
				const p = S.pos.clone().addScaledVector(rg, .22).addScaledVector(d, 1.2);
				p.y -= .13;
				const v = d.clone().add(new T.Vector3(rnd() - .5, rnd() - .5, rnd() - .5).multiplyScalar(.02)).normalize(),
					m = new T.Mesh(TB, TBm);
				m.position.copy(p);
				m.quaternion.setFromUnitVectors(new T.Vector3(0, 0, 1), v);
				scene.add(m);
				PR.push({
					m,
					v: v.multiplyScalar(170),
					t: 0
				});
				const f = new T.Mesh(sg, BM(0xffdd55));
				f.position.copy(p);
				scene.add(f);
				FX.push({
					m: f,
					t: 0,
					L: .05,
					u() {}
				});
				FL.position.copy(p);
				FL.intensity = 2.5;
				WP.shake = Math.max(WP.shake, .08);
				body.position.z = .03;
				snd(300, .05, 0)
			}
			const hitAt = q => q.y <= .05 || B.some(b => Math.abs(q.x - b.x) < b.w / 2 && Math.abs(q.z - b.z) < b.d / 2 && q.y <
				b.h);
			act.missile = () => {
				if (S.mode === 'landed' || WP.ms < 1) return;
				const d = AIM.clone(),
					i = 4 - WP.ms,
					rg = new T.Vector3(Math.cos(S.yaw), 0, -Math.sin(S.yaw)),
					m = mkMs(1, true);
				WP.ms--;
				WP.mt = 0;
				m.position.copy(S.pos).addScaledVector(rg, (i % 2 ? 1 : -1) * .36).addScaledVector(d, .8);
				m.position.y -= .12;
				scene.add(m);
				MS.push({
					m,
					v: d.clone().multiplyScalar(25).add(S.vel),
					t: 0,
					tg: lockT(d)
				});
				puff(m.position, 0xffffff, 1.5, 2);
				FL.position.copy(m.position);
				FL.intensity = 3;
				WP.shake = .25;
				snd(160, .6, 1)
			};
			/* ---- 红外 / 夜视 ---- */
			const vst = document.createElement('style');
			vst.textContent =
				'#vis{position:absolute;inset:0;pointer-events:none;display:none;font:700 14px monospace;color:#7f7;text-shadow:0 0 4px #000}#vis:before{content:"";position:absolute;inset:0;background:radial-gradient(circle,transparent 55%,rgba(0,0,0,.85)),repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px)}#vis span{position:absolute;left:50%;bottom:64px;transform:translateX(-50%)}select{font:inherit;font-size:14px;padding:9px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:var(--glass);color:var(--tx)}select option{color:#000}';
			document.head.appendChild(vst);
			const vis = document.createElement('div');
			vis.id = 'vis';
			vis.innerHTML = '<span></span>';
			rd.domElement.after(vis);
			let VI = 0;
			const VF = ['', 'grayscale(1) contrast(1.6) sepia(1) hue-rotate(-30deg) saturate(6)',
					'grayscale(1) sepia(1) hue-rotate(55deg) saturate(5) brightness(2.2) contrast(1.4)'
				],
				VT = ['', 'IR 红外热成像', 'NV 夜视仪'];

			function setV(v) {
				VI = VI === v ? 0 : v;
				rd.domElement.style.filter = VF[VI];
				vis.style.display = VI ? 'block' : 'none';
				vis.firstChild.textContent = VT[VI];
				vis.style.color = VI == 1 ? '#fc8' : '#7f7'
			}
			act.ir = () => setV(1);
			act.nv = () => setV(2);
			act.next = () => load((SI + 1) % SC.length);
			act.prev = () => load((SI + SC.length - 1) % SC.length);
			Object.assign(ONCE, {
				KeyG: 'missile',
				KeyI: 'ir',
				KeyN: 'nv',
				BracketRight: 'next',
				BracketLeft: 'prev'
			});
			const sel = document.createElement('select');
			SC.forEach((s, i) => sel.add(new Option((i + 1) + '. ' + s.n, i)));
			sel.onchange = () => {
				load(+sel.value);
				sel.blur()
			};
			$('bar').prepend(sel);
			[
				['prev', '◀'],
				['next', '▶'],
				['missile', '导弹 G'],
				['ir', '红外 I'],
				['nv', '夜视 N']
			].forEach(([a, t]) => {
				const b = document.createElement('button');
				b.textContent = t;
				b.onclick = () => act[a]();
				$('bar').appendChild(b)
			}); {
				const b = document.createElement('button');
				b.textContent = '机枪 F（按住）';
				b.onpointerdown = e => {
					e.preventDefault();
					keys.KeyF = true
				};
				['pointerup', 'pointercancel', 'pointerleave'].forEach(v => b.addEventListener(v, () => keys.KeyF = false));
				$('bar').appendChild(b)
			}
			/* ---- 每帧扩展 ---- */
			const _upd = update,
				_hud = hud;
			update = function(dt) {
				_upd(dt);
				const t = performance.now() / 1000,
					cp = Math.cos(S.gp),
					rg = new T.Vector3(Math.cos(S.yaw), 0, -Math.sin(S.yaw)),
					armed = S.mode !== 'landed';
				AIM.set(-Math.sin(S.yaw) * cp, Math.sin(S.gp), -Math.cos(S.yaw) * cp);
				AN.forEach(f => f(t, dt));
				WP.gt -= dt;
				if (keys.KeyF && armed && WP.ammo > 0 && WP.gt <= 0) {
					WP.gt = .05;
					WP.ammo--;
					shoot(AIM, rg)
				}
				gun.rotation.z += (keys.KeyF && armed ? 35 : 0) * dt;
				body.position.z *= Math.exp(-dt * 20);
				if (!armed) WP.ammo = Math.min(500, WP.ammo + 120 * dt);
				if (WP.ms < 4) {
					WP.mt += dt * (armed ? 1 : 4);
					if (WP.mt > 6) {
						WP.mt = 0;
						WP.ms++
					}
				}
				pods.forEach((p, j) => p.visible = j >= 4 - WP.ms);
				for (let i = PR.length - 1; i >= 0; i--) {
					const p = PR[i],
						q = p.m.position;
					q.addScaledVector(p.v, dt);
					p.t += dt;
					let h = hitAt(q);
					TG.forEach(g => {
						if (!g.dead && q.distanceTo(g.m.position) < g.r) {
							h = true;
							hurt(g, 1)
						}
					});
					if (h) spark(q);
					if (h || p.t > 1.5) {
						scene.remove(p.m);
						PR.splice(i, 1)
					}
				}
				for (let i = MS.length - 1; i >= 0; i--) {
					const p = MS[i],
						q = p.m.position;
					p.t += dt;
					if (p.tg && !p.tg.dead) {
						const sp_ = p.v.length(),
							to = p.tg.m.position.clone().sub(q).normalize();
						p.v.normalize().lerp(to, Math.min(1, dt * 2.5)).normalize().multiplyScalar(sp_)
					}
					p.v.setLength(Math.min(95, p.v.length() + 90 * dt));
					q.addScaledVector(p.v, dt);
					p.m.lookAt(q.clone().add(p.v));
					puff(q.clone().addScaledVector(p.v.clone().normalize(), -1), 0xdddddd, .9, .8);
					if (p.t > .15 && (hitAt(q) || TG.some(g => !g.dead && q.distanceTo(g.m.position) < 3.5) || p.t > 6)) {
						boom(q.clone(), 1.3);
						TG.forEach(g => {
							const dd = g.m.position.distanceTo(q);
							if (!g.dead && dd < 9) hurt(g, dd < 4 ? 3 : 2)
						});
						scene.remove(p.m);
						MS.splice(i, 1)
					}
				}
				for (let i = FX.length - 1; i >= 0; i--) {
					const f = FX[i];
					f.t += dt;
					const r = f.t / f.L;
					f.u(r, dt);
					if (r >= 1) {
						scene.remove(f.m);
						f.m.material.dispose();
						FX.splice(i, 1)
					}
				}
				FL.intensity *= Math.exp(-dt * 10);
				if (WP.shake > .001) {
					cam.position.add(new T.Vector3(rnd() - .5, rnd() - .5, rnd() - .5).multiplyScalar(WP.shake * .6));
					WP.shake *= Math.exp(-dt * 6)
				}
			};
			hud = function() {
				_hud();
				$('hud').innerHTML +=
					`<br>场景　${SI+1}/${SC.length} ${SC[SI].n}<br>机枪　${WP.ammo|0}　导弹　${WP.ms}/4${lockT(AIM)?' 🔒锁定':''}<br>击毁　${WP.kills}/${TG.length}${VI?'<br>'+VT[VI]:''}`
			};
			load(0);
			hud();
			toast('按 T 起飞');
			requestAnimationFrame(loop);
		</script>
	</body>
</html>
